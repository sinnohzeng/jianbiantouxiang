<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf9f6" />
    <meta
      name="description"
      content="纯前端的渐变头像生成器。选配色与质感，导出可直接用作群聊、账号与部门标识的图片。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="渐变头像生成器 · Gradient Avatar" />
    <meta
      property="og:description"
      content="纯前端的渐变头像生成器。选配色与质感，导出可直接用作群聊、账号与部门标识的图片。"
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>渐变头像生成器 · Gradient Avatar</title>
    <script>
      // 首帧前定好主题，避免深色偏好下先闪一下白底。key 与 src/app/theme.ts 一致
      ;(function () {
        try {
          var stored = localStorage.getItem('gradient-avatar:theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#1b1a17' : '#fbf9f6')
        } catch (error) {
          void error
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
